version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    labels:
      - dependabot
    commit-message:
      prefix: chore
  - package-ecosystem: swift
    directory: /Sdk/MParticle.Maui.Sdk/macios/native/mParticleSPM
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependabot
    commit-message:
      prefix: chore
  - package-ecosystem: swift
    directory: /Kits/rokt/Sdk/MParticle.Maui.Rokt/macios/native/mParticleSPM
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependabot
    commit-message:
      prefix: chore
  - package-ecosystem: swift
    directory: /Kits/rokt/Sdk/MParticle.Maui.Rokt.Payments/macios/native/mParticleRoktPaymentsSPM
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependabot
    commit-message:
      prefix: chore
