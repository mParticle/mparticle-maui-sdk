name: Create draft release

on:
  workflow_dispatch: # checkov:skip=CKV_GHA_7
    inputs:
      bump-type:
        description: Specify if the version should be bumped as major, minor, patch
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
      version-suffix:
        description: "The suffix to apply to the test version e.g. -beta.1, -SNAPSHOT. If not provided defaults to -alpha.{build-number}."
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  SDK_PATH: Sdk/MParticle.Maui.Sdk
  SDK_PROJECT: MParticle.Maui.Sdk
  ROKT_KIT_PATH: Kits/rokt/Sdk/MParticle.Maui.Rokt
  ROKT_KIT_PROJECT: mParticle.Maui.Kits.Rokt
  PAYMENTS_KIT_PATH: Kits/rokt/Sdk/MParticle.Maui.Rokt.Payments
  PAYMENTS_KIT_PROJECT: mParticle.Maui.Kits.Rokt.Payments

jobs:
  publish-draft-release:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate version suffix
        env:
          VERSION_SUFFIX_INPUT: ${{ github.event.inputs.version-suffix }}
        run: |
          if [ -n "$VERSION_SUFFIX_INPUT" ]; then
            if [[ ! "$VERSION_SUFFIX_INPUT" =~ ^-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
              echo "Error: Invalid version-suffix. It must start with '-' and can include periods or hyphens followed by alphanumeric characters, e.g., '-SNAPSHOT', '-alpha.3'." >&2
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: rokt
          token-service-url: https://int.nugettest.org/api/v2/token
          audience: https://int.nugettest.org

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.103

      - name: Setup XCode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.2"

      - name: Install .NET MAUI
        run: dotnet workload install maui --version 10.0.103

      - name: Get current version
        id: version-file
        run: |
          version_from_file=$(head -n 1 VERSION)
          echo "release-version=$version_from_file" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump-version
        uses: actions-ecosystem/action-bump-semver@34e334551143a5301f38c830e44a22273c6ff5c5 # v1.0.0
        with:
          current_version: ${{ steps.version-file.outputs.release-version }}
          level: ${{ github.event.inputs.bump-type || 'patch' }}

      - name: Save validated version to file
        env:
          NEW_VERSION: ${{ steps.bump-version.outputs.new_version }}
        run: |
          echo "$NEW_VERSION" > VERSION

      - name: Release version name
        id: version-suffix
        env:
          VERSION_SUFFIX_INPUT: ${{ github.event.inputs.version-suffix }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$VERSION_SUFFIX_INPUT" ]; then
            version_suffix="$VERSION_SUFFIX_INPUT"
          else
            version_suffix="-alpha.$RUN_NUMBER"
          fi
          echo "version-suffix=$version_suffix" >> $GITHUB_OUTPUT

      - name: Export full version with suffix
        id: full-version
        env:
          NEW_VERSION: ${{ steps.bump-version.outputs.new_version }}
          VERSION_SUFFIX: ${{ steps.version-suffix.outputs.version-suffix }}
        run: |
          full_version="${NEW_VERSION}${VERSION_SUFFIX}"
          echo "full-version-with-suffix=$full_version" >> $GITHUB_OUTPUT
          echo "FULL_VERSION_WITH_SUFFIX=$full_version" >> "$GITHUB_ENV"

      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@f62c3c390716df5af712ba5d94f4f4a8efc1306d # 3.1.0
        with:
          tag: ${{ steps.bump-version.outputs.new_version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Resolve SPM dependencies for Xcode project
        run: |
          cd ${{ env.SDK_PATH }}/macios/native/mParticleBinding
          xcodebuild -resolvePackageDependencies -project mParticleBinding.xcodeproj -scheme mParticleBinding

      - name: Build Xcode project to generate framework
        run: |
          cd ${{ env.SDK_PATH }}/macios/native/mParticleBinding
          xcodebuild -project mParticleBinding.xcodeproj -scheme mParticleBinding -configuration Release -sdk iphoneos build
          xcodebuild -project mParticleBinding.xcodeproj -scheme mParticleBinding -configuration Release -sdk iphonesimulator build

      - name: Build SDK
        run: dotnet build ${{ env.SDK_PATH }}/${{ env.SDK_PROJECT }}.csproj -c Release -p:Version="$FULL_VERSION_WITH_SUFFIX"

      - name: Pack SDK
        run: dotnet pack ${{ env.SDK_PATH }}/${{ env.SDK_PROJECT }}.csproj -c Release -p:Version="$FULL_VERSION_WITH_SUFFIX"

      - name: Publish to NuGet Test Gallery
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "${{ env.SDK_PATH }}/bin/Release/mParticle.MAUI.${FULL_VERSION_WITH_SUFFIX}.nupkg" --source https://apiint.nugettest.org/v3/index.json --api-key "$NUGET_API_KEY"

      - name: Resolve SPM dependencies for Rokt Kit iOS binding
        run: |
          cd ${{ env.ROKT_KIT_PATH }}/macios/native/mParticleRoktBinding
          xcodebuild -resolvePackageDependencies -project mParticleRoktBinding.xcodeproj -scheme mParticleRoktBinding

      - name: Build Xcode project for Rokt Kit iOS
        run: |
          cd ${{ env.ROKT_KIT_PATH }}/macios/native/mParticleRoktBinding
          xcodebuild -project mParticleRoktBinding.xcodeproj -scheme mParticleRoktBinding -configuration Release -sdk iphoneos build
          xcodebuild -project mParticleRoktBinding.xcodeproj -scheme mParticleRoktBinding -configuration Release -sdk iphonesimulator build

      - name: Build Rokt Kit
        run: dotnet build ${{ env.ROKT_KIT_PATH }}/${{ env.ROKT_KIT_PROJECT }}.csproj -c Release -p:Version="$FULL_VERSION_WITH_SUFFIX"

      - name: Pack Rokt Kit
        run: dotnet pack ${{ env.ROKT_KIT_PATH }}/${{ env.ROKT_KIT_PROJECT }}.csproj -c Release -p:Version="$FULL_VERSION_WITH_SUFFIX"

      - name: Publish Rokt Kit to NuGet Test Gallery
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "${{ env.ROKT_KIT_PATH }}/bin/Release/${{ env.ROKT_KIT_PROJECT }}.${FULL_VERSION_WITH_SUFFIX}.nupkg" --source https://apiint.nugettest.org/v3/index.json --api-key "$NUGET_API_KEY"

      - name: Resolve SPM dependencies for Rokt Payments Kit iOS binding
        run: |
          cd ${{ env.PAYMENTS_KIT_PATH }}/macios/native/mParticleRoktPaymentsBinding
          xcodebuild -resolvePackageDependencies -project mParticleRoktPaymentsBinding.xcodeproj -scheme mParticleRoktPaymentsBinding

      - name: Build Xcode project for Rokt Payments Kit iOS
        run: |
          cd ${{ env.PAYMENTS_KIT_PATH }}/macios/native/mParticleRoktPaymentsBinding
          xcodebuild -project mParticleRoktPaymentsBinding.xcodeproj -scheme mParticleRoktPaymentsBinding -configuration Release -sdk iphoneos build
          xcodebuild -project mParticleRoktPaymentsBinding.xcodeproj -scheme mParticleRoktPaymentsBinding -configuration Release -sdk iphonesimulator build

      - name: Build Rokt Payments Kit
        run: dotnet build ${{ env.PAYMENTS_KIT_PATH }}/${{ env.PAYMENTS_KIT_PROJECT }}.csproj -c Release -p:Version="$FULL_VERSION_WITH_SUFFIX"

      - name: Pack Rokt Payments Kit
        run: dotnet pack ${{ env.PAYMENTS_KIT_PATH }}/${{ env.PAYMENTS_KIT_PROJECT }}.csproj -c Release -p:Version="$FULL_VERSION_WITH_SUFFIX"

      - name: Publish Rokt Payments Kit to NuGet Test Gallery
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "${{ env.PAYMENTS_KIT_PATH }}/bin/Release/${{ env.PAYMENTS_KIT_PROJECT }}.${FULL_VERSION_WITH_SUFFIX}.nupkg" --source https://apiint.nugettest.org/v3/index.json --api-key "$NUGET_API_KEY"

      - name: Set .csproj version for SDK
        uses: vers-one/dotnet-project-version-updater@6d4de57b8f089d58a00b6ede1f3f05c77bb8e541 # v1.7
        with:
          file: ${{ env.SDK_PATH }}/${{ env.SDK_PROJECT }}.csproj
          version: ${{ steps.bump-version.outputs.new_version }}

      - name: Set .csproj version for Rokt Kit
        uses: vers-one/dotnet-project-version-updater@6d4de57b8f089d58a00b6ede1f3f05c77bb8e541 # v1.7
        with:
          file: ${{ env.ROKT_KIT_PATH }}/${{ env.ROKT_KIT_PROJECT }}.csproj
          version: ${{ steps.bump-version.outputs.new_version }}

      - name: Set .csproj version for Rokt Payments Kit
        uses: vers-one/dotnet-project-version-updater@6d4de57b8f089d58a00b6ede1f3f05c77bb8e541 # v1.7
        with:
          file: ${{ env.PAYMENTS_KIT_PATH }}/${{ env.PAYMENTS_KIT_PROJECT }}.csproj
          version: ${{ steps.bump-version.outputs.new_version }}

      - name: Upload Package Artifact for SDK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.SDK_PROJECT }}.${{ steps.full-version.outputs.full-version-with-suffix }}.nupkg
          path: ${{ env.SDK_PATH }}/bin/Release/mParticle.MAUI.${{ steps.full-version.outputs.full-version-with-suffix }}.nupkg

      - name: Upload Package Artifact for Rokt Kit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ROKT_KIT_PROJECT }}.${{ steps.full-version.outputs.full-version-with-suffix }}.nupkg
          path: ${{ env.ROKT_KIT_PATH }}/bin/Release/${{ env.ROKT_KIT_PROJECT }}.${{ steps.full-version.outputs.full-version-with-suffix }}.nupkg

      - name: Upload Package Artifact for Rokt Payments Kit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PAYMENTS_KIT_PROJECT }}.${{ steps.full-version.outputs.full-version-with-suffix }}.nupkg
          path: ${{ env.PAYMENTS_KIT_PATH }}/bin/Release/${{ env.PAYMENTS_KIT_PROJECT }}.${{ steps.full-version.outputs.full-version-with-suffix }}.nupkg

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SDK_RELEASE_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            mparticle-maui-sdk
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: Create ${{ steps.bump-version.outputs.new_version }}
          branch: release/${{ steps.bump-version.outputs.new_version }}
          title: Prepare release ${{ steps.bump-version.outputs.new_version }}
          add-paths: CHANGELOG.md, VERSION, ${{ env.SDK_PATH }}/${{ env.SDK_PROJECT }}.csproj, ${{ env.ROKT_KIT_PATH }}/${{ env.ROKT_KIT_PROJECT }}.csproj, ${{ env.PAYMENTS_KIT_PATH }}/${{ env.PAYMENTS_KIT_PROJECT }}.csproj
          base: main
          body: |
            Preparing for release ${{ steps.bump-version.outputs.new_version }}
            - Bumped version
            - Updated changelog
            - Generated test build ${{ steps.full-version.outputs.full-version-with-suffix }}
